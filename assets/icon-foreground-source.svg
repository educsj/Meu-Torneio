<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Transparent background — the OS / splash backgroundColor provides the fill.
       Android adaptive-icon spec masks the outer ~33%, so the trophy lives
       inside the central safe zone (a 660px-wide region centered at 512,512). -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.5" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="goldDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#92400e"/>
    </linearGradient>
  </defs>

  <!-- Trophy handles -->
  <path d="M 360 380 Q 280 380 280 470 Q 280 545 380 562 L 380 510 Q 340 502 340 470 Q 340 430 380 430 Z"
        fill="url(#goldDark)"/>
  <path d="M 664 380 Q 744 380 744 470 Q 744 545 644 562 L 644 510 Q 684 502 684 470 Q 684 430 644 430 Z"
        fill="url(#goldDark)"/>

  <!-- Cup body -->
  <path d="M 360 350 L 664 350 L 652 555 Q 642 625 580 650 L 444 650 Q 382 625 372 555 Z"
        fill="url(#gold)"/>

  <!-- Cup rim band -->
  <rect x="354" y="344" width="316" height="36" rx="10" fill="#fde68a"/>
  <rect x="354" y="344" width="316" height="36" rx="10" fill="none" stroke="#b45309" stroke-width="5"/>

  <!-- Star detail -->
  <path d="M 512 450 L 522 480 L 553 480 L 528 498 L 537 528 L 512 510 L 487 528 L 496 498 L 471 480 L 502 480 Z"
        fill="#fef3c7" opacity="0.9"/>

  <!-- Stem -->
  <rect x="484" y="650" width="56" height="50" fill="url(#goldDark)"/>

  <!-- Base (two tiers) -->
  <rect x="412" y="700" width="200" height="32" rx="6" fill="url(#gold)"/>
  <rect x="380" y="732" width="264" height="46" rx="8" fill="url(#goldDark)"/>
</svg>
